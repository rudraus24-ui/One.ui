<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Heart Ferris Wheel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 70% 80%, #2a001a 0%, #0d0008 55%, #000000 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    /* Glassmorphism Wish Card */
    .text-box {
      position: absolute;
      left: 5%;
      top: 22%;
      z-index: 10;
      width: 360px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 28px 32px;
      border-radius: 20px;
      border: 1px solid rgba(255, 105, 180, 0.25);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(255, 105, 180, 0.1);
    }
    .wish-line {
      margin-bottom: 14px;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #fff0f5;
      text-shadow: 0 0 10px rgba(255, 105, 180, 0.8), 0 0 2px #fff;
      min-height: 28px;
    }
    .hint-text {
      position: absolute;
      bottom: 22px;
      width: 100%;
      text-align: center;
      font-size: 0.88rem;
      color: #ff97b7;
      z-index: 10;
      letter-spacing: 1.5px;
      opacity: 0.8;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(255, 71, 126, 0.6);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="text-box" id="textBox"></div>
    <canvas id="canvas"></canvas>
    <div class="hint-text">✨ Screen par click karke magical fireworks dekhein! ✨</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // --- Background Twinkling Stars ---
    const stars = [];
    for (let i = 0; i < 110; i++) {
      stars.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 1.5,
        alpha: Math.random(),
        speed: Math.random() * 0.02 + 0.005
      });
    }

    function drawStars() {
      stars.forEach(star => {
        star.alpha += star.speed;
        if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
        ctx.fillStyle = `rgba(255, 200, 220, ${Math.abs(star.alpha)})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    // --- Heart Drawer ---
    function drawHeart(x, y, size, color, alpha = 1) {
      if (size <= 0) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.translate(x, y);
      ctx.scale(size, size);
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-5, -5, -10, 0, 0, 10);
      ctx.bezierCurveTo(10, 0, 5, -5, 0, 0);
      ctx.fillStyle = color;
      ctx.shadowBlur = 12;
      ctx.shadowColor = color;
      ctx.fill();
      ctx.restore();
    }

    // --- Ferris Wheel Configuration ---
    let wheelAngle = 0;
    const colors = ['#ff0055', '#ff2a75', '#ff528c', '#ff73a5', '#ff9ebb', '#ffd700', '#00f0ff'];
    const fallingHearts = [];

    function drawFerrisWheel() {
      const centerX = canvas.width * 0.68;
      const centerY = canvas.height * 0.52;
      const radius = 170;
      const numPods = 10;

      ctx.save();

      // 1. Stand / Support Legs
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(centerX - 90, canvas.height * 0.92);
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(centerX + 90, canvas.height * 0.92);
      ctx.strokeStyle = '#ff3377';
      ctx.lineWidth = 6;
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#ff0055';
      ctx.stroke();

      // Base Platform Line
      ctx.beginPath();
      ctx.moveTo(centerX - 130, canvas.height * 0.92);
      ctx.lineTo(centerX + 130, canvas.height * 0.92);
      ctx.lineWidth = 4;
      ctx.stroke();

      // 2. Outer & Inner Rotating Rings
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 105, 180, 0.8)';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(centerX, centerY, radius * 0.5, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 182, 193, 0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 3. Spokes & Heart Pods (Seats)
      for (let i = 0; i < numPods; i++) {
        const angle = wheelAngle + (i * (Math.PI * 2 / numPods));
        const px = centerX + Math.cos(angle) * radius;
        const py = centerY + Math.sin(angle) * radius;

        // Draw Spoke Line
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(px, py);
        ctx.strokeStyle = 'rgba(255, 105, 180, 0.4)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Draw Hanging Line for Pod
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px, py + 12);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        // Draw Glowing Heart Seat/Pod
        const podColor = colors[i % colors.length];
        drawHeart(px, py + 15, 0.85, podColor);

        // Spawn falling heart sparkles from moving pods
        if (Math.random() < 0.08) {
          fallingHearts.push({
            x: px + (Math.random() * 10 - 5),
            y: py + 25,
            size: Math.random() * 0.4 + 0.25,
            color: podColor,
            vy: Math.random() * 1.2 + 0.5,
            sway: Math.random() * Math.PI * 2,
            swaySpeed: Math.random() * 0.03 + 0.01,
            alpha: 1
          });
        }
      }

      // 4. Center Glowing Hub
      ctx.beginPath();
      ctx.arc(centerX, centerY, 16, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 20;
      ctx.shadowColor = '#ff0055';
      ctx.fill();

      drawHeart(centerX, centerY - 5, 0.6, '#ff0055');

      ctx.restore();

      // Rotate Wheel
      wheelAngle += 0.005;
    }

    // --- Interactive Click Fireworks ---
    const clickParticles = [];
    window.addEventListener('click', (e) => {
      for (let i = 0; i < 22; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        clickParticles.push({
          x: e.clientX,
          y: e.clientY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1,
          size: Math.random() * 0.6 + 0.3,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1
        });
      }
    });

    // --- Main Animation Loop ---
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawStars();
      drawFerrisWheel();

      // Render Falling Sparkle Hearts
      for (let i = fallingHearts.length - 1; i >= 0; i--) {
        const p = fallingHearts[i];
        p.sway += p.swaySpeed;
        p.x += Math.sin(p.sway) * 0.7;
        p.y += p.vy;
        p.alpha -= 0.003;

        drawHeart(p.x, p.y, p.size, p.color, Math.max(0, p.alpha));

        if (p.alpha <= 0 || p.y > canvas.height) {
          fallingHearts.splice(i, 1);
        }
      }

      // Render Click Firework Particles
      for (let i = clickParticles.length - 1; i >= 0; i--) {
        const cp = clickParticles[i];
        cp.x += cp.vx;
        cp.y += cp.vy;
        cp.vy += 0.05;
        cp.alpha -= 0.02;

        if (cp.alpha > 0) {
          drawHeart(cp.x, cp.y, cp.size, cp.color, cp.alpha);
        } else {
          clickParticles.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }

    // --- Typewriter Wishes ---
    const wishes = [
      "Hey you 💕",
      "Happy Birthday 🌸",
      "May God bless you 🎈",
      "And give u many happiness 💖",
      "Just saying... you're pretty awesome 💕",
      "Sending good vibes and maybe a wish 💫"
    ];

    let lineIndex = 0;
    let charIndex = 0;
    const textBox = document.getElementById('textBox');

    function startTypewriter() {
      if (lineIndex < wishes.length) {
        if (charIndex === 0) {
          const div = document.createElement('div');
          div.className = 'wish-line';
          div.id = `line-${lineIndex}`;
          textBox.appendChild(div);
        }

        const currentLine = document.getElementById(`line-${lineIndex}`);
        currentLine.textContent += wishes[lineIndex].charAt(charIndex);
        charIndex++;

        if (charIndex < wishes[lineIndex].length) {
          setTimeout(startTypewriter, 45);
        } else {
          charIndex = 0;
          lineIndex++;
          setTimeout(startTypewriter, 360);
        }
      }
    }

    // Start Everything
    animate();
    setTimeout(startTypewriter, 600);
  </script>
</body>
</html>
