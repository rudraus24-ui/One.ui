<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday | Glowing Blooming Rose</title>
  <style>
    /* --- CSS RESET & BASE STYLES --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030105;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #ffffff;
      user-select: none;
    }

    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: flex-start; /* Keeps text box aligned to the left */
    }

    /* Fullscreen Canvas Layer */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    /* --- GLASSMORPHISM TYPOGRAPHY CARD (LEFT SIDE) --- */
    .card-wrapper {
      position: relative;
      z-index: 10;
      width: 88%;
      max-width: 460px;
      margin-left: 6%;
      padding: 35px 40px;
      background: rgba(15, 6, 18, 0.42);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      border: 1px solid rgba(255, 105, 135, 0.22);
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.85),
        inset 0 0 20px rgba(255, 70, 110, 0.1),
        0 0 35px rgba(255, 40, 90, 0.15);
      pointer-events: none; /* Lets mouse clicks pass through to canvas for interactive sparks */
      transition: all 0.5s ease;
    }

    .card-header {
      font-size: 0.82rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ff9ebb;
      margin-bottom: 18px;
      opacity: 0.85;
      text-shadow: 0 0 10px rgba(255, 105, 135, 0.6);
    }

    .typewriter-text {
      font-size: 1.18rem;
      line-height: 1.8;
      color: #fff0f4;
      min-height: 170px;
      text-shadow: 0 0 12px rgba(255, 182, 193, 0.4);
      white-space: pre-line;
    }

    /* Custom Typewriter Caret */
    .caret {
      display: inline-block;
      width: 2px;
      height: 1.2em;
      background-color: #ff3366;
      margin-left: 4px;
      vertical-align: middle;
      box-shadow: 0 0 8px #ff3366;
      animation: blink 0.9s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .hint-footer {
      position: absolute;
      bottom: 22px;
      width: 100%;
      text-align: center;
      font-size: 0.78rem;
      letter-spacing: 2px;
      color: #ff8da1;
      opacity: 0.65;
      z-index: 10;
      pointer-events: none;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(255, 50, 100, 0.6);
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 768px) {
      .container {
        justify-content: center;
      }
      .card-wrapper {
        margin-left: 0;
        margin-top: 240px; /* Shift text card down on phone portrait screens so rose blooms freely above */
        padding: 26px 24px;
        max-width: 90%;
      }
      .typewriter-text {
        font-size: 1.02rem;
        min-height: 150px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <canvas id="stage"></canvas>
    
    <div class="card-wrapper">
      <div class="card-header">✦ Birthday Greeting ✦</div>
      <div class="typewriter-text" id="typewriter"></div>
    </div>

    <div class="hint-footer">✨ Tap anywhere for magical bursts ✨</div>
  </div>

  <script>
    /* =========================================================================
       CANVAS & SYSTEM INIT
       ========================================================================= */
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    /* =========================================================================
       1. TWINKLING STARS & NIGHT SKY
       ========================================================================= */
    const stars = [];
    const STAR_COUNT = 140;

    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 1.4 + 0.2,
        alpha: Math.random(),
        speed: Math.random() * 0.015 + 0.005,
        color: ['#ffffff', '#ffe6f0', '#ffd1dc', '#e6f0ff'][Math.floor(Math.random() * 4)]
      });
    }

    function renderStars() {
      stars.forEach(s => {
        s.alpha += s.speed;
        if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
        
        ctx.save();
        ctx.globalAlpha = Math.abs(s.alpha);
        ctx.fillStyle = s.color;
        ctx.shadowBlur = s.radius * 4;
        ctx.shadowColor = s.color;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    /* =========================================================================
       2. ORGANIC STEM & LEAF GROWTH ENGINE
       ========================================================================= */
    const stemPoints = [];
    let stemProgress = 0; // 0 to 1
    const STEM_GROWTH_SPEED = 0.005; // Growth speed

    function getRoseCenter() {
      const isMobile = width < 768;
      return {
        x: isMobile ? width * 0.5 : width * 0.72,
        y: isMobile ? height * 0.32 : height * 0.42
      };
    }

    function generateStemPath() {
      stemPoints.length = 0;
      const target = getRoseCenter();
      const startX = target.x - 20;
      const startY = height + 20;
      const totalSteps = 150;

      for (let i = 0; i <= totalSteps; i++) {
        const t = i / totalSteps;
        // Curved natural quadratic curve path
        const x = (1 - t) * (1 - t) * startX + 2 * (1 - t) * t * (target.x - 80) + t * t * target.x;
        const y = (1 - t) * (1 - t) * startY + 2 * (1 - t) * t * (height * 0.7) + t * t * target.y;
        stemPoints.push({ x, y });
      }
    }
    generateStemPath();

    function drawLeaf(x, y, angle, scale) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.scale(scale, scale);

      ctx.shadowBlur = 12;
      ctx.shadowColor = '#10b981';

      // Leaf Shape
      const leafGrad = ctx.createLinearGradient(0, 0, 40, 0);
      leafGrad.addColorStop(0, '#064e3b');
      leafGrad.addColorStop(0.5, '#10b981');
      leafGrad.addColorStop(1, '#022c22');

      ctx.fillStyle = leafGrad;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(15, -20, 45, -20, 55, 0);
      ctx.bezierCurveTo(45, 20, 15, 20, 0, 0);
      ctx.fill();

      // Leaf Vein Line
      ctx.strokeStyle = '#a7f3d0';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(48, 0);
      ctx.stroke();

      ctx.restore();
    }

    function renderStem() {
      if (stemPoints.length === 0) return;

      const currentMaxIndex = Math.floor(stemPoints.length * stemProgress);
      if (currentMaxIndex < 2) return;

      ctx.save();
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#059669';
      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';

      ctx.beginPath();
      ctx.moveTo(stemPoints[0].x, stemPoints[0].y);
      for (let i = 1; i < currentMaxIndex; i++) {
        ctx.lineTo(stemPoints[i].x, stemPoints[i].y);
      }
      ctx.stroke();
      ctx.restore();

      // Leaves sprouting along stem trajectory at set thresholds
      if (stemProgress > 0.45) {
        const leaf1Index = Math.floor(stemPoints.length * 0.42);
        const p1 = stemPoints[leaf1Index];
        const leaf1Scale = Math.min(1, (stemProgress - 0.45) * 4);
        drawLeaf(p1.x, p1.y, -Math.PI * 0.75, leaf1Scale * 0.85);
      }

      if (stemProgress > 0.72) {
        const leaf2Index = Math.floor(stemPoints.length * 0.70);
        const p2 = stemPoints[leaf2Index];
        const leaf2Scale = Math.min(1, (stemProgress - 0.72) * 4);
        drawLeaf(p2.x, p2.y, -Math.PI * 0.15, leaf2Scale * 0.95);
      }
    }

    /* =========================================================================
       3. MATHEMATICAL BLOOMING ROSE ENGINE
       ========================================================================= */
    let bloomProgress = 0; // 0 to 1

    function renderRose() {
      if (stemProgress < 0.95) return; // Wait until stem reaches the top

      if (bloomProgress < 1) {
        bloomProgress += 0.006; // Smooth opening speed
      }

      const center = getRoseCenter();
      ctx.save();
      ctx.translate(center.x, center.y);

      // Sepal Calyx (Green base under rose)
      ctx.save();
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#059669';
      ctx.fillStyle = '#047857';
      for (let i = 0; i < 5; i++) {
        const sepalAngle = (Math.PI * 2 / 5) * i + Math.PI * 0.5;
        ctx.save();
        ctx.rotate(sepalAngle);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-12, 10, -15, 30, 0, 42 * Math.min(1, bloomProgress * 1.5));
        ctx.bezierCurveTo(15, 30, 12, 10, 0, 0);
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();

      // Procedural Layered Petals (Golden Spiral Parametric Distribution)
      const TOTAL_PETALS = 55;
      const maxRadius = 85 * bloomProgress;

      for (let i = TOTAL_PETALS; i > 0; i--) {
        const petalRatio = i / TOTAL_PETALS; // 1 = Outer, 0 = Inner
        
        // Golden Angle distribution for natural spiraling layering
        const angle = i * 2.39996; 
        const currentPetalMaxDist = maxRadius * Math.pow(petalRatio, 0.8);

        // Individual petal bloom scale expansion
        const petalScale = Math.max(0, (bloomProgress - (1 - petalRatio) * 0.6)) * (1 / 0.4);
        const clampedScale = Math.min(1, Math.max(0, petalScale));

        if (clampedScale <= 0) continue;

        const px = Math.cos(angle) * currentPetalMaxDist * clampedScale;
        const py = Math.sin(angle) * currentPetalMaxDist * clampedScale * 0.82; // Slight vertical tilt perspective

        const petalWidth = (35 + petalRatio * 45) * clampedScale;
        const petalHeight = (40 + petalRatio * 50) * clampedScale;

        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(angle + Math.PI / 2);

        // Rich Glowing Crimson Color Gradient
        const pGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, petalWidth);
        if (petalRatio < 0.25) {
          // Inner core - Deep Velvet Ruby
          pGrad.addColorStop(0, '#ffe5ec');
          pGrad.addColorStop(0.4, '#e60039');
          pGrad.addColorStop(1, '#80001a');
        } else if (petalRatio < 0.65) {
          // Mid petals - Glowing Red
          pGrad.addColorStop(0, '#ff6685');
          pGrad.addColorStop(0.5, '#dc0032');
          pGrad.addColorStop(1, '#590012');
        } else {
          // Outer petals - Deep Crimson Edges
          pGrad.addColorStop(0, '#ff335c');
          pGrad.addColorStop(0.6, '#b30024');
          pGrad.addColorStop(1, '#33000a');
        }

        ctx.fillStyle = pGrad;
        ctx.shadowBlur = petalRatio > 0.4 ? 18 : 8;
        ctx.shadowColor = '#ff0033';

        // Organic Petal Shape
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-petalWidth * 0.7, -petalHeight * 0.4, -petalWidth * 0.6, -petalHeight * 1.1, 0, -petalHeight);
        ctx.bezierCurveTo(petalWidth * 0.6, -petalHeight * 1.1, petalWidth * 0.7, -petalHeight * 0.4, 0, 0);
        ctx.fill();

        // Subtle Petal Edge Highlight
        ctx.strokeStyle = `rgba(255, 200, 215, ${0.15 + petalRatio * 0.25})`;
        ctx.lineWidth = 0.8;
        ctx.stroke();

        ctx.restore();
      }

      ctx.restore();
    }

    /* =========================================================================
       4. FALLING PETALS WITH AERODYNAMIC WIND SWAY
       ========================================================================= */
    const fallingPetals = [];

    class FallingPetal {
      constructor() {
        this.reset(true);
      }

      reset(initial = false) {
        this.x = Math.random() * width;
        this.y = initial ? Math.random() * height : -30;
        this.size = Math.random() * 8 + 7;
        
        this.vx = Math.random() * 1.2 + 0.5;
        this.vy = Math.random() * 1.2 + 0.8;

        this.sway = Math.random() * Math.PI * 2;
        this.swaySpeed = Math.random() * 0.02 + 0.01;

        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.03;

        const colors = [
          { fill: '#ff2a55', glow: '#ff0033' },
          { fill: '#ff5277', glow: '#ff1a4a' },
          { fill: '#e60039', glow: '#990026' },
          { fill: '#ff85a1', glow: '#ff3366' }
        ];
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.alpha = Math.random() * 0.4 + 0.6;
      }

      update() {
        this.sway += this.swaySpeed;
        this.rotation += this.rotSpeed;

        this.x += Math.sin(this.sway) * 1.2 + this.vx * 0.5;
        this.y += this.vy;

        if (this.y > height + 40 || this.x > width + 40) {
          this.reset(false);
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.globalAlpha = this.alpha;

        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color.glow;
        ctx.fillStyle = this.color.fill;

        // Curved Falling Petal Path
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-this.size, -this.size * 1.4, -this.size * 1.5, this.size * 0.5, 0, this.size * 1.6);
        ctx.bezierCurveTo(this.size * 1.5, this.size * 0.5, this.size, -this.size * 1.4, 0, 0);
        ctx.fill();

        ctx.restore();
      }
    }

    // Populate falling petals (activated when rose starts blooming)
    for (let i = 0; i < 35; i++) {
      fallingPetals.push(new FallingPetal());
    }

    /* =========================================================================
       5. AMBIENT GLOWING DUST PARTICLES
       ========================================================================= */
    const ambientParticles = [];
    for (let i = 0; i < 60; i++) {
      ambientParticles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 2 + 0.5,
        vx: (Math.random() - 0.5) * 0.4,
        vy: -Math.random() * 0.5 - 0.2,
        alpha: Math.random() * 0.7 + 0.3
      });
    }

    function renderAmbientParticles() {
      ambientParticles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;

        if (p.y < -10) {
          p.y = height + 10;
          p.x = Math.random() * width;
        }

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = '#ffb3c1';
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#ff0055';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
    }

    /* =========================================================================
       6. INTERACTIVE CLICK FIREWORKS / SPARKS
       ========================================================================= */
    const sparks = [];

    class Spark {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1.5;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.alpha = 1;
        this.decay = Math.random() * 0.025 + 0.015;
        this.color = ['#ff2a55', '#ff7395', '#ffd700', '#ffffff', '#ff0055'][Math.floor(Math.random() * 5)];
        this.size = Math.random() * 2.2 + 0.8;
      }

      update() {
        this.vx *= 0.95;
        this.vy *= 0.95;
        this.vy += 0.04; // Light gravity
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    window.addEventListener('click', (e) => {
      for (let i = 0; i < 30; i++) {
        sparks.push(new Spark(e.clientX, e.clientY));
      }
    });

    /* =========================================================================
       7. TYPEWRITER MESSAGE ENGINE
       ========================================================================= */
    const messageLines = [
      "Happy Birthday! 🌹",
      "May your day bloom with beauty, grace, and endless happiness.",
      "Like a glowing rose opening under the night sky, may your coming year be radiant and filled with magical moments.",
      "Keep shining bright... ✨"
    ];

    const typewriterEl = document.getElementById('typewriter');
    let currentLine = 0;
    let currentChar = 0;

    const caret = document.createElement('span');
    caret.className = 'caret';

    function typeNextChar() {
      if (currentLine < messageLines.length) {
        const fullLine = messageLines[currentLine];
        
        if (currentChar === 0 && currentLine > 0) {
          typewriterEl.innerHTML += '<br><br>';
        }

        if (currentChar < fullLine.length) {
          if (typewriterEl.contains(caret)) {
            typewriterEl.removeChild(caret);
          }
          
          typewriterEl.innerHTML += fullLine.charAt(currentChar);
          typewriterEl.appendChild(caret);
          currentChar++;

          const speed = Math.random() * 35 + 40;
          setTimeout(typeNextChar, speed);
        } else {
          currentLine++;
          currentChar = 0;
          setTimeout(typeNextChar, 650);
        }
      }
    }

    // Delay typewriter start until stem is growing
    setTimeout(typeNextChar, 1200);

    /* =========================================================================
       8. MAIN ANIMATION LOOP
       ========================================================================= */
    function animate() {
      // Dark Cinematic Vignette Background
      ctx.fillStyle = 'rgba(3, 1, 5, 0.28)';
      ctx.fillRect(0, 0, width, height);

      renderStars();
      renderAmbientParticles();

      // Stem growth update
      if (stemProgress < 1) {
        stemProgress += STEM_GROWTH_SPEED;
      }

      renderStem();
      renderRose();

      // Render falling petals only after rose starts blooming
      if (bloomProgress > 0.1) {
        fallingPetals.forEach(p => {
          p.update();
          p.draw();
        });
      }

      // Render Interactive Spark Burst
      for (let i = sparks.length - 1; i >= 0; i--) {
        const s = sparks[i];
        s.update();
        s.draw();
        if (s.alpha <= 0) sparks.splice(i, 1);
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
