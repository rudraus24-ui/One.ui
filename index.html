<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Heart Tree</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    /* Canvas for Tree */
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    /* Left Side Text Wishes */
    .text-box {
      position: absolute;
      left: 6%;
      top: 25%;
      z-index: 10;
      max-width: 380px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-size: 1rem;
      line-height: 1.8;
      color: #f8fafc;
      text-shadow: 0 0 8px rgba(255, 105, 180, 0.5);
    }
    .wish-line {
      margin-bottom: 6px;
      min-height: 24px;
    }
    /* Bottom Timer Box */
    .timer-box {
      position: absolute;
      bottom: 5%;
      width: 100%;
      text-align: center;
      z-index: 10;
      font-size: 0.95rem;
      color: #cbd5e1;
      letter-spacing: 1px;
      font-family: monospace;
    }
    .timer-box span {
      color: #ff69b4;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="text-box" id="textBox"></div>

    <canvas id="canvas"></canvas>

    <div class="timer-box" id="timerBox">
      <span id="days">077</span> days 
      <span id="hours">08</span> hours 
      <span id="minutes">06</span> minutes 
      <span id="seconds">14</span> seconds
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Exact Text Lines from Video
    const wishes = [
      "Hey you 💕",
      "Happy Birthday 🌸",
      "May God bless you 🎈",
      "And give u many happiness 💖",
      "Just saying... you're pretty awesome 💕",
      "Sending good vibes and maybe a wish 💫"
    ];

    // Typewriter Effect
    let lineIndex = 0;
    let charIndex = 0;
    const textBox = document.getElementById('textBox');

    function startTypewriter() {
      if (lineIndex < wishes.length) {
        if (charIndex === 0) {
          const div = document.createElement('div');
          div.className = 'wish-line';
          div.id = `line-${lineIndex}`;
          textBox.appendChild(div);
        }

        const currentLine = document.getElementById(`line-${lineIndex}`);
        currentLine.textContent += wishes[lineIndex].charAt(charIndex);
        charIndex++;

        if (charIndex < wishes[lineIndex].length) {
          setTimeout(startTypewriter, 50);
        } else {
          charIndex = 0;
          lineIndex++;
          setTimeout(startTypewriter, 300);
        }
      }
    }

    // Draw Heart Function
    function drawHeart(x, y, size, color) {
      ctx.save();
      ctx.beginPath();
      ctx.translate(x, y);
      ctx.scale(size, size);
      ctx.moveTo(0, 0);
      ctx.bezierCurveTo(-5, -5, -10, 0, 0, 10);
      ctx.bezierCurveTo(10, 0, 5, -5, 0, 0);
      ctx.fillStyle = color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = color;
      ctx.fill();
      ctx.restore();
    }

    // Branching Tree Animation Setup
    const startX = canvas.width * 0.62;
    const startY = canvas.height * 0.88;
    const branchEndpoints = [];

    // Recursive Tree Drawing Function
    function drawBranch(x, y, length, angle, branchWidth, depth) {
      ctx.beginPath();
      ctx.save();
      ctx.strokeStyle = '#ff85a2';
      ctx.lineWidth = branchWidth;
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#ff477e';
      ctx.lineCap = 'round';
      
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -length);
      ctx.stroke();

      const endX = x + length * Math.sin(angle * Math.PI / 180);
      const endY = y - length * Math.cos(angle * Math.PI / 180);

      if (depth < 8) {
        // Grow Sub-branches
        setTimeout(() => {
          drawBranch(endX, endY, length * 0.78, angle - 22, branchWidth * 0.7, depth + 1);
          drawBranch(endX, endY, length * 0.78, angle + 22, branchWidth * 0.7, depth + 1);
        }, 120);
      } else {
        // Store tip for leaves
        branchEndpoints.push({ x: endX, y: endY });
      }

      ctx.restore();
    }

    // Heart Leaves Formation
    const leaves = [];
    const colors = ['#ff0055', '#ff508f', '#ff70a6', '#ff97b7', '#ffea00', '#00f0ff'];

    function createHeartCanopy() {
      const centerX = startX;
      const centerY = startY - 180;

      for (let i = 0; i < 380; i++) {
        const t = Math.PI * 2 * Math.random();
        const r = Math.sqrt(Math.random());
        // Parametric Heart Formula
        const hx = 16 * Math.pow(Math.sin(t), 3);
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

        const x = centerX + hx * 11 * r;
        const y = centerY + hy * 11 * r;
        const size = Math.random() * 0.7 + 0.4;
        const color = colors[Math.floor(Math.random() * colors.length)];

        leaves.push({ x, y, size, color, currentSize: 0 });
      }

      animateLeaves();
      startTypewriter();
    }

    function animateLeaves() {
      let completed = true;
      leaves.forEach(leaf => {
        if (leaf.currentSize < leaf.size) {
          leaf.currentSize += 0.02;
          completed = false;
        }
        drawHeart(leaf.x, leaf.y, leaf.currentSize, leaf.color);
      });

      if (!completed) {
        requestAnimationFrame(animateLeaves);
      }
    }

    // Live Timer Functionality
    let totalSecs = 77 * 86400 + 8 * 3600 + 6 * 60 + 14;
    setInterval(() => {
      totalSecs++;
      const d = Math.floor(totalSecs / 86400);
      const h = Math.floor((totalSecs % 86400) / 3600);
      const m = Math.floor((totalSecs % 3600) / 60);
      const s = totalSecs % 60;

      document.getElementById('days').textContent = String(d).padStart(3, '0');
      document.getElementById('hours').textContent = String(h).padStart(2, '0');
      document.getElementById('minutes').textContent = String(m).padStart(2, '0');
      document.getElementById('seconds').textContent = String(s).padStart(2, '0');
    }, 1000);

    // Start Tree Growth
    drawBranch(startX, startY, 110, 0, 14, 0);

    // Blossom Canopy after Tree grows
    setTimeout(createHeartCanopy, 1500);
  </script>
</body>
</html>
